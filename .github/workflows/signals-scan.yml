name: Signals Scan

# Phase 4 (pilot) + Phase 9 (full universe, sharded) of
# docs/backend-state-and-supabase-plan.md.
#
# workflow_dispatch defaults to the small pilot list for quick manual checks
# (fast, single job, no matrix). The scheduled cron run scans the full
# 954-ticker seed, sharded 4 ways per the plan's sizing
# (strategy.matrix.shard: [0,1,2,3], each job taking ticker_index % 4 ==
# shard) to stay well under the Actions job time cap and isolate failures —
# one shard's yfinance hiccup doesn't take down the other three.

on:
  schedule:
    # 21:25 UTC ~= 16:25 ET, ~10 min after US market close, weekdays only.
    - cron: "25 21 * * 1-5"
  workflow_dispatch:
    inputs:
      symbols:
        description: "Space-separated tickers (blank = default 5-ticker pilot list; ignored if 'full' is checked)"
        required: false
        default: ""
      full_universe:
        description: "Scan the full seed/universe_symbols.csv, sharded 4 ways (ignores 'symbols' above)"
        type: boolean
        required: false
        default: false
      period:
        description: "yfinance period string"
        required: false
        default: "3mo"
      dry_run:
        description: "Gate + log only, no LLM calls or writes"
        type: boolean
        required: false
        default: true
      direction:
        description: "Publication direction"
        type: choice
        options: [both, bullish, bearish]
        default: both
      max_concurrent:
        description: "Concurrent symbol fetches (1-4)"
        type: number
        default: 4
      matrix:
        description: "Also compute the 5-timeframe matrix (Phase 10) for gated symbols — up to 5x fetches/LLM calls. Pilot job only, not available on full_universe (too expensive at 954 tickers)."
        type: boolean
        required: false
        default: false

concurrency:
  # Two overlapping scans would double-write and double-spend LLM tokens.
  group: signals-scan
  cancel-in-progress: false

env:
  DEFAULT_SYMBOLS: "AAPL MSFT GOOGL SPY QQQ"

jobs:
  # Pilot path: manual dispatch with a small explicit or default symbol
  # list. Not used by the schedule — the schedule always runs the sharded
  # full-universe job below.
  scan-pilot:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.full_universe != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          environment-name: signals-app
          cache-environment: true
          cache-downloads: true

      - name: Install package (editable, no deps)
        shell: bash -l {0}
        run: pip install -e . --no-deps

      - name: Run scan
        shell: bash -l {0}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INPUT_SYMBOLS: ${{ inputs.symbols }}
          INPUT_PERIOD: ${{ inputs.period }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_MATRIX: ${{ inputs.matrix }}
          INPUT_DIRECTION: ${{ inputs.direction }}
          INPUT_MAX_CONCURRENT: ${{ inputs.max_concurrent }}
        run: |
          read -r -a symbols <<< "${INPUT_SYMBOLS:-$DEFAULT_SYMBOLS}"
          args=(--period "${INPUT_PERIOD:-3mo}" --trigger manual --report-file scan-outcomes/pilot.json)
          if [[ "$INPUT_DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          if [[ "$INPUT_MATRIX" == "true" ]]; then args+=(--matrix); fi
          if [[ -n "$INPUT_MAX_CONCURRENT" ]]; then args+=(--max-concurrent "$INPUT_MAX_CONCURRENT"); fi
          if [[ -n "$INPUT_DIRECTION" && "$INPUT_DIRECTION" != "both" ]]; then args+=(--direction "$INPUT_DIRECTION"); fi
          python scripts/scan_universe.py "${symbols[@]}" "${args[@]}"

      - name: Preserve pilot outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signals-scan-pilot-${{ github.run_id }}
          path: scan-outcomes/pilot.json
          if-no-files-found: warn
          retention-days: 14

  # Full-universe path: the scheduled cron run, or a manual dispatch with
  # full_universe=true. Matrix-sharded 4 ways across seed/universe_symbols.csv.
  scan-full:
    # Fires on: the schedule (canonical repo only, never a fork), or a
    # manual dispatch with full_universe=true.
    if: |
      (github.event_name == 'schedule' && github.repository == 'adamaslan/signals-app') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.full_universe == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          environment-name: signals-app
          cache-environment: true
          cache-downloads: true

      - name: Install package (editable, no deps)
        shell: bash -l {0}
        run: pip install -e . --no-deps

      - name: Run scan (shard ${{ matrix.shard }}/4)
        shell: bash -l {0}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INPUT_PERIOD: ${{ inputs.period }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_DIRECTION: ${{ inputs.direction }}
          INPUT_MAX_CONCURRENT: ${{ inputs.max_concurrent }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=(--seed seed/universe_symbols.csv --shard "${{ matrix.shard }}/4" --period "${INPUT_PERIOD:-3mo}" --report-file "scan-outcomes/shard-${{ matrix.shard }}.json")
          if [[ "$INPUT_DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          if [[ -n "$INPUT_MAX_CONCURRENT" ]]; then args+=(--max-concurrent "$INPUT_MAX_CONCURRENT"); fi
          if [[ -n "$INPUT_DIRECTION" && "$INPUT_DIRECTION" != "both" ]]; then args+=(--direction "$INPUT_DIRECTION"); fi
          TRIGGER="manual"
          if [ "$EVENT_NAME" = "schedule" ]; then
            TRIGGER="cron"
          fi
          python scripts/scan_universe.py "${args[@]}" --trigger "$TRIGGER"

      - name: Preserve shard outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signals-scan-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: scan-outcomes/shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 14
