name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          environment-name: signals-app
          cache-environment: true
          cache-downloads: true

      - name: Install package (editable, no deps)
        shell: bash -l {0}
        run: pip install -e . --no-deps

      - name: Install lint/type deps
        shell: bash -l {0}
        run: pip install ruff mypy

      # Advisory, not blocking: 121 ruff findings and 38 mypy findings predate
      # this workflow (see docs/backend-state-and-supabase-plan.md, defects
      # section) and are pre-existing debt, not regressions from this PR.
      # Flip these to hard failures once that cleanup pass lands.
      - name: Ruff check
        shell: bash -l {0}
        run: ruff check . || echo "::warning::ruff found pre-existing issues (non-blocking)"

      - name: Mypy
        shell: bash -l {0}
        run: mypy src/signals_app || echo "::warning::mypy found pre-existing issues (non-blocking)"

      - name: Pytest
        shell: bash -l {0}
        run: pytest -q

  frontend:
    # A prior version of this workflow excluded web/** from CI entirely.
    # deploy-pages.yml then failed silently on every push for ~7 weeks
    # (2026-06-28 to 2026-08-19) before this build check existed — see PR #10.
    # Building here is what would have caught it.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (static export)
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests (Playwright)
        run: npm run test:e2e

  fib-guard:
    # SA6 (FIBONACCI.md §13.1/§7 invariant 7): a change under the fib paths
    # (detection, indicators, and their pivots) must bump pyproject.toml's
    # version — the release the portal's CANONICAL_SOURCE names — and the PR
    # description must say whether nuwrrrld-portal's golden fixture
    # (__tests__/fixtures/fib-golden.json, PO4) was regenerated against it.
    # Advisory only, same as the ruff/mypy steps above: this repo's CI
    # convention is to warn, not block, until the underlying debt/process is
    # actually enforced end to end.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether fib paths changed
        id: fib-diff
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- \
            'src/signals_app/detection/fibonacci.py' \
            'src/signals_app/indicators/fibonacci.py' \
            'src/signals_app/indicators/pivots.py' || true)
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "$CHANGED"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check version bump
        if: steps.fib-diff.outputs.changed == 'true'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          OLD_VERSION=$(git show "origin/${{ github.base_ref }}:pyproject.toml" | grep -m1 '^version' || true)
          NEW_VERSION=$(grep -m1 '^version' pyproject.toml || true)
          echo "base: $OLD_VERSION"
          echo "head: $NEW_VERSION"
          if [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
            echo "::warning::This PR touches Fibonacci detection/indicator paths but pyproject.toml's version was not bumped. Bump it (SIGNALS_APP_CODE_VERSION / the release nuwrrrld-portal's CANONICAL_SOURCE names), and say in the PR body whether the portal's fib golden fixture (PO4) was regenerated."
          fi

      - name: Check PR body mentions the portal fixture
        if: steps.fib-diff.outputs.changed == 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! printf '%s' "$PR_BODY" | grep -qi 'fixture'; then
            echo "::warning::This PR touches Fibonacci detection/indicator paths but its description doesn't mention whether nuwrrrld-portal's golden fixture (PO4, __tests__/fixtures/fib-golden.json) was regenerated. State that explicitly in the PR body."
          fi
