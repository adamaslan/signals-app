name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          environment-name: signals-app
          cache-environment: true
          cache-downloads: true

      - name: Install package (editable, no deps)
        shell: bash -l {0}
        run: pip install -e . --no-deps

      - name: Install lint/type deps
        shell: bash -l {0}
        run: pip install ruff mypy

      # Advisory, not blocking: 121 ruff findings and 38 mypy findings predate
      # this workflow (see docs/backend-state-and-supabase-plan.md, defects
      # section) and are pre-existing debt, not regressions from this PR.
      # Flip these to hard failures once that cleanup pass lands.
      - name: Ruff check
        shell: bash -l {0}
        run: ruff check . || echo "::warning::ruff found pre-existing issues (non-blocking)"

      - name: Mypy
        shell: bash -l {0}
        run: mypy src/signals_app || echo "::warning::mypy found pre-existing issues (non-blocking)"

      - name: Pytest
        shell: bash -l {0}
        run: pytest -q

  frontend:
    # A prior version of this workflow excluded web/** from CI entirely.
    # deploy-pages.yml then failed silently on every push for ~7 weeks
    # (2026-06-28 to 2026-08-19) before this build check existed — see PR #10.
    # Building here is what would have caught it.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (static export)
        run: npm run build
