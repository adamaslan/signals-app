[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signals-app"
version = "0.1.0"
description = "Financial signal detection + LLM synthesis app"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pandas",
    "numpy",
    "yfinance",
    "pydantic",
    "httpx",
    "python-dotenv",
    "google-generativeai",
    "asyncpg",
    "aiosqlite",
    "sqlalchemy",
    "typer>=0.12",
    "rich",
]

[project.scripts]
# The real CLI. `signals analyze SYMBOL`, `signals backtest`, `signals serve`, …
signals = "signals_app.cli.main:app"
# Deprecated: kept for one release cycle. Warns and forwards to `signals serve`
# (it never ran an analysis despite the name — see docs/signals-app-docs/).
signals-analyze = "signals_app.cli.main:_deprecated_analyze_shim"

# `backtests` is a top-level package (repo-root, not under src/). It has to be
# installed too, or the `signals` console script — which runs with no repo root
# on sys.path — can't import backtests.engine (used by signals_app.service).
[tool.setuptools.packages.find]
where = ["src", "."]
include = ["signals_app*", "backtests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
