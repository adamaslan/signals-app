[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signals-app"
version = "0.1.0"
description = "Financial signal detection + LLM synthesis app"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pandas",
    "numpy",
    "yfinance",
    "pydantic",
    "httpx",
    "python-dotenv",
    "google-generativeai",
    "asyncpg",
    "aiosqlite",
    "sqlalchemy",
]

[project.scripts]
signals-analyze = "signals_app.api.main:cli_entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
